# Exit criteria of the port milestones (docs/mac/MISSION.md §8), one entry per criterion.
# tools/mac/mac_progress.py turns this file into the "port milestones" percentage.
#
# status:   "verified" = met and verified by a command whose result is in PROGRESS.md
#           "partial"  = some of it is done; counts as 0 (only verified criteria count)
#           "open"     = not done
# progress: the start of a "## " heading in docs/mac/PROGRESS.md that records the verification.
#           Required for "verified"; the tool fails if no heading starts with it.
# evidence: short summary of the result, with log paths under .mac-work/logs/ where they exist.
#
# Weighting: each milestone is worth the same (20 %), and inside a milestone each criterion is worth the
# same. A MISSION bullet that names two separate subjects is split into two criteria (M3: the homebrew
# title and the user's title; M4: one criterion per optimisation in the "implement and measure" list).
# Change a status only together with the PROGRESS.md entry that verifies it.

